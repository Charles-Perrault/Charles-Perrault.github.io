<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1017">
    <title>Megaminx · Cube Lab</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="../puzzle-switcher.css?v=1">
  </head>
  <body>
    <main class="stage">
      <canvas id="puzzle" tabindex="0" aria-label="Interactive Megaminx. Drag a sticker to turn or drag the background to orbit. Use brackets to turn the selected face."></canvas>
      <header><h1 id="puzzle-name">Megaminx</h1></header>
      <nav class="puzzle-switcher" aria-label="Puzzles">
        <a href="../">Cube</a>
        <span aria-current="page">Minx family</span>
        <a href="../curvy-copter-plus/">Curvy Copter Plus</a>
      </nav>
      <button class="reset-view" id="view" type="button">Reset view</button>
      <div class="controls">
        <div class="setup-dock">
          <section aria-labelledby="size-heading">
            <div class="section-heading">
              <h2 id="size-heading">Minx size</h2>
              <a id="size-link" href="#layers=3">Share size</a>
            </div>
            <form id="resize" class="size-form">
              <label class="sr-only" for="layers">Minx size in layers</label>
              <input id="layers" type="number" min="2" step="1" required value="3">
              <button id="apply-size" type="submit">Resize</button>
            </form>
            <div class="presets" role="group" aria-label="Minx size presets">
              <button type="button" data-size="2">2</button>
              <button type="button" data-size="3" aria-pressed="true">3</button>
              <button type="button" data-size="4">4</button>
              <button type="button" data-size="5">5</button>
              <button type="button" data-size="7">7</button>
            </div>
          </section>
          <div class="speed-row">
            <label for="speed" title="1 = 1 turn per second">Turn speed</label>
            <input id="speed" type="number" min="0" step="any" required value="24" aria-describedby="speed-rate">
            <span id="speed-rate">24 turns/sec</span>
          </div>
        </div>
        <div class="row actions">
          <button class="primary" id="solve" type="button">Solve Megaminx</button>
          <button id="stop" type="button" disabled>Stop</button>
        </div>
        <section aria-labelledby="scramble-label">
          <div class="section-heading">
            <h2 id="scramble-label">Scramble</h2>
            <span class="section-meta" id="count">60 moves</span>
          </div>
          <div class="row">
            <button id="instant" type="button">Instant scramble</button>
            <button id="animate" type="button">Scramble</button>
          </div>
          <button class="reset-puzzle" id="reset" type="button">Reset puzzle</button>
        </section>
        <section class="turns" aria-labelledby="turn-label">
          <h2 id="turn-label">Turn a face</h2>
          <label class="face-picker"><span id="swatch"></span><select id="face" aria-label="Selected face"></select></label>
          <label class="slice-picker" id="slice-picker" hidden>Layer <select id="slice"></select></label>
          <div class="row">
            <button id="left" type="button" title="[">Counterclockwise</button>
            <button id="right" type="button" title="]">Clockwise</button>
          </div>
        </section>
      </div>
      <div class="status"><span id="state" role="status">Solved</span><span id="applied"></span></div>
      <progress id="turn-progress" max="100" value="0" hidden aria-label="Turn progress"></progress>
      <p class="hint">Drag a sticker to turn · Drag the background to orbit · Scroll or pinch to zoom</p>
    </main>
    <script type="module" src="app.mjs?v=6"></script>
  </body>
</html>
