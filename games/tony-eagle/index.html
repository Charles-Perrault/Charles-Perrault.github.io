<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony Eagle — Amateur Skateboarding</title>
<style>
* { box-sizing: border-box; } [hidden] { display: none !important; }
html, body { width: 100%; height: 100%; margin: 0; background: #151b21; color: #eef4f6; font: 13px/1.5 Tahoma, sans-serif; }
body { display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #151b21; outline: none; }
#cover { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; background: #151b21ee; }
#cover h1 { margin: 0 0 8px; font-size: clamp(20px, 4vw, 30px); }
#cover p { margin: 6px 0; max-width: 570px; }
#progress { width: min(380px, 80vw); margin: 16px auto; accent-color: #76d6c3; }
button, a { color: inherit; } button { border: 1px solid #9eb8bf; padding: 8px 16px; color: #111; background: #dbefea; font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid #ffda6b; outline-offset: 3px; }
#resume { justify-self: center; margin-top: 14px; }
#cover[data-mode="paused"] { background: #808080a8; }
#cover[data-mode="paused"] h1, #cover[data-mode="paused"] #status { display: none; }
#cover[data-mode="paused"] #resume { margin: 0; padding: 0; border: 0; background: transparent; color: white; font-size: clamp(40px, 9vw, 110px); font-weight: 900; line-height: 1; }
#cover[data-mode="phone"] h1 { font-size: clamp(26px, 7vw, 48px); max-width: 850px; }
footer { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 12px; background: #202c34; font-size: 11px; }
footer p { margin: 0; } .actions { display: flex; align-items: center; gap: 12px; }
footer button { font-size: 11px; padding: 3px 9px; }
#error-help { font-size: 12px; color: #c3d1d7; }
#cheat-notice { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); margin: 0; padding: 6px 12px; max-width: 90%; background: #202c34e8; color: #ffda6b; font-weight: bold; text-align: center; pointer-events: none; }
#ranked-result { position: absolute; bottom: 12px; left: 12px; padding: 8px 12px; max-width: min(440px, 90%); background: #202c34ee; font-size: 12px; }
#ranked-result p { margin: 0 0 5px; }
#ranked-submit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#ranked-name { font: inherit; width: 150px; padding: 5px; }
#ranked-submit button { padding: 4px 8px; }
</style>
</head>
<body>
<main id="stage" aria-label="Tony Eagle game">
<canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="Tony Eagle. Arrow keys or WASD to move. Hold and release Space or B to jump."></canvas>
<section id="cover" aria-live="polite">
<h1>Tony Eagle</h1>
<p id="status">Loading Amateur Skateboarding…</p>
<progress id="progress" max="1" value="0" aria-label="Game download progress"></progress>
<p id="error-help" hidden></p>
<button type="button" id="resume" hidden>Click to play</button>
</section>
<p id="cheat-notice" role="status" hidden>UNLIMITED UPGRADE POINTS UNLOCKED</p>
<section id="ranked-result" aria-live="polite" hidden><p id="ranked-message"></p><form id="ranked-submit" hidden><label>Your name <input id="ranked-name" maxlength="24" required autocomplete="nickname"></label><button id="ranked-submit-button" type="submit">Submit score</button></form></section>
</main>
<footer>
<div><p>Original game by <a href="https://gamejolt.com/games/tony-eagle-amateur-skateboarding/24295" target="_blank" rel="noopener noreferrer">GloveGames</a>, this is just a preservation I did of a childhood favorite because you can't play it anywhere online in 2026</p><p id="controls">Arrows / WASD: move · Hold Space / B, release to jump</p></div>
<div class="actions"><button type="button" id="leaderboard-open">Leaderboard</button><button type="button" id="reset-upgrades" hidden>Reset upgrades</button><button type="button" id="pause" disabled>Pause</button><button type="button" id="fullscreen">Fullscreen</button></div>
</footer>
<script src="leaderboard.js?v=4"></script>
<script src="player.js?v=7"></script>
</body>
</html>
